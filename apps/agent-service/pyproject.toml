[project]
name = "digital-human-agent-service"
version = "0.1.6"
description = "FastAPI and LangGraph runtime for the digital human agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langgraph>=0.2",
  "mcp>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "sse-starlette>=3.0,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
rag = ["docling>=2.0,<3.0"]
# FutureAGI's OTel distribution currently supports Python 3.10-3.13. On
# Python 3.14 the application keeps the local sink rather than failing install.
observability = ["fi-instrumentation-otel>=1.1,<2.0; python_version < '3.14'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
