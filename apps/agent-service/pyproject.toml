[project]
name = "digital-human-agent-service"
version = "0.1.54"
description = "FastAPI and LangGraph runtime for the digital human agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langgraph>=0.2",
  "mcp>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "sse-starlette>=3.0,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
  "aio-pika>=9.4,<10.0",
  "redis>=5.0,<7.0",
  "playwright>=1.50,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
rag = ["docling>=2.0,<3.0", "faiss-cpu>=1.9,<2.0", "sentence-transformers>=3.0,<6.0"]
# FutureAGI's OTel distribution currently supports Python 3.10-3.13. On
# Python 3.14 the application keeps the local sink rather than failing install.
observability = ["fi-instrumentation-otel>=1.1,<2.0; python_version < '3.14'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

# The default rule set (E4/E7/E9 + F) is what CI enforces. The heavier families
# below are opted in because they catch real defects here, but each one that
# conflicts with a deliberate pattern is scoped out rather than silenced
# inline -- a wall of `# noqa` hides the next genuine finding.
[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F",   # pycodestyle + pyflakes
  "I",                     # import sorting
  "UP",                    # pyupgrade
  "B",                     # flake8-bugbear
  "C4",                    # flake8-comprehensions
  "SIM",                   # flake8-simplify
  "RUF",                   # ruff-specific
]
ignore = [
  # Blind excepts are load-bearing: the observability, cache, redis and bus
  # paths must degrade to a local fallback instead of failing a chat request,
  # and the domain error is deliberately swallowed at those boundaries. These
  # are the boundaries where "log and continue" is the specified behaviour, not
  # an oversight, so the rule is off project-wide rather than suppressed 97
  # times. Genuine silent failures are caught by the tests instead.
  "BLE001",
  "S110",
  # FastAPI/Depends-style callable defaults are the framework's contract.
  "B008",
  # PYI rules assume a stub file; these modules are runtime code.
  "PYI036", "PYI034",
  # Mutable class attributes here are read-mostly lookup tables and counters
  # that are intentionally shared across instances.
  "RUF012",
  # The codebase documents itself in Chinese, where full-width punctuation
  # (，。：；) and comparison signs are correct orthography rather than a
  # homoglyph hazard. Flagging them would bury the real findings.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on raised exception *types*, which some rules read as redundant
# isinstance checks, and several must bootstrap sys.path before importing the
# application package, which E402 reads as an out-of-order import.
"tests/*" = ["TRY004", "SIM117", "F841", "PLR0124", "E402"]

