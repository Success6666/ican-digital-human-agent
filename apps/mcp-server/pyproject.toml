[project]
name = "digital-human-mcp-server"
version = "0.1.44"
description = "Internal MCP 2.x Streamable HTTP probe server"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "starlette>=0.37",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
