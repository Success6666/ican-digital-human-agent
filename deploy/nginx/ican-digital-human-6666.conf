# WireGuard 公网入口：保留 6666，并提供浏览器可用的 16666 -> 本机 10.66.66.2:8088
server {
    listen 6666;
    listen [::]:6666;
    listen 16666 ssl;
    listen [::]:16666 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/39.97.253.99/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/39.97.253.99/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ICAN_TLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 16m;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location / {
        proxy_pass http://10.66.66.2:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
