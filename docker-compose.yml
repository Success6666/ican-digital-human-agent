name: ican-digital-human

services:
  web:
    build:
      context: ./apps/web
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
      - "${WEB_WG_BIND_ADDRESS:-127.0.0.1}:${WEB_WG_PORT:-18088}:80"
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  auth-service:
    build:
      context: ./apps/auth-service
    environment:
      SERVER_PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AGENT_BASE_URL: http://agent-service:8000
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-dev-internal-token}
      AGENT_REALTIME_PATH: ${AGENT_REALTIME_PATH:-/internal/realtime}
      AGENT_REALTIME_MAX_QUEUE_BYTES: ${AGENT_REALTIME_MAX_QUEUE_BYTES:-262144}
      AGENT_REALTIME_SEND_TIME_LIMIT_MS: ${AGENT_REALTIME_SEND_TIME_LIMIT_MS:-10000}
      AGENT_REALTIME_BUFFER_SIZE_BYTES: ${AGENT_REALTIME_BUFFER_SIZE_BYTES:-524288}
      AGENT_REALTIME_MAX_CONNECTIONS: ${AGENT_REALTIME_MAX_CONNECTIONS:-256}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173,http://127.0.0.1:5173,http://39.97.253.99:16666,https://39.97.253.99:16666}
    expose:
      - "8080"
    depends_on:
      agent-service:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  asr-service:
    build:
      context: ./apps/asr-service
    environment:
      ASR_MODEL_DIR: /models
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-tiny}
      ASR_DEVICE: ${ASR_DEVICE:-auto}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-auto}
      ASR_LANGUAGE: zh
      ASR_BEAM_SIZE: ${ASR_BEAM_SIZE:-1}
      ASR_MAX_AUDIO_BYTES: ${ASR_MAX_AUDIO_BYTES:-10485760}
      ASR_INTERNAL_TOKEN: ${ASR_INTERNAL_TOKEN:-dev-asr-token}
    expose:
      - "7000"
    volumes:
      - asr-model-cache:/models
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health', timeout=3)\""]
      interval: 15s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  agent-service:
    build:
      context: ./apps/agent-service
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-dev-internal-token}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:9000/mcp}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://ican:ican@rabbitmq:5672/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-ican.agent}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-digital-human.presentation.v2}
      SESSION_STORE_BACKEND: ${SESSION_STORE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-ican:agent}
      REDIS_OPERATION_TIMEOUT_SECONDS: ${REDIS_OPERATION_TIMEOUT_SECONDS:-0.25}
      RESPONSE_CACHE_ENABLED: ${RESPONSE_CACHE_ENABLED:-true}
      RESPONSE_CACHE_TTL_SECONDS: ${RESPONSE_CACHE_TTL_SECONDS:-300}
      RESPONSE_CACHE_MAX_BYTES: ${RESPONSE_CACHE_MAX_BYTES:-256000}
      RESPONSE_CACHE_MAX_ENTRIES: ${RESPONSE_CACHE_MAX_ENTRIES:-100000}
      RESPONSE_CACHE_SCOPE: ${RESPONSE_CACHE_SCOPE:-tenant}
      RESPONSE_CACHE_LOCK_SECONDS: ${RESPONSE_CACHE_LOCK_SECONDS:-15}
      AGENT_MAX_IN_FLIGHT_REQUESTS: ${AGENT_MAX_IN_FLIGHT_REQUESTS:-4096}
      RABBITMQ_MAX_IN_FLIGHT: ${RABBITMQ_MAX_IN_FLIGHT:-512}
      RABBITMQ_PREFETCH_COUNT: ${RABBITMQ_PREFETCH_COUNT:-256}
      RABBITMQ_RETRY_LIMIT: ${RABBITMQ_RETRY_LIMIT:-3}
      HTTP_ASR_ENDPOINT: ${HTTP_ASR_ENDPOINT:-http://asr-service:7000/transcribe}
      HTTP_ASR_API_KEY: ${HTTP_ASR_API_KEY:-${ASR_INTERNAL_TOKEN:-dev-asr-token}}
      HTTP_ASR_TIMEOUT_SECONDS: ${HTTP_ASR_TIMEOUT_SECONDS:-30}
      HTTP_ASR_MAX_RESPONSE_BYTES: ${HTTP_ASR_MAX_RESPONSE_BYTES:-1048576}
      HTTP_TTS_ENDPOINT: ${HTTP_TTS_ENDPOINT:-}
      HTTP_TTS_API_KEY: ${HTTP_TTS_API_KEY:-}
      HTTP_TTS_TIMEOUT_SECONDS: ${HTTP_TTS_TIMEOUT_SECONDS:-8}
      HTTP_TTS_CHUNK_BYTES: ${HTTP_TTS_CHUNK_BYTES:-640}
      HTTP_TTS_MAX_RESPONSE_BYTES: ${HTTP_TTS_MAX_RESPONSE_BYTES:-4194304}
      MCP_REQUEST_TIMEOUT_SECONDS: ${MCP_REQUEST_TIMEOUT_SECONDS:-8}
      MCP_ALLOW_LOCAL_FALLBACK: ${MCP_ALLOW_LOCAL_FALLBACK:-true}
      MCP_FAST_PATH_TIMEOUT_SECONDS: ${MCP_FAST_PATH_TIMEOUT_SECONDS:-0.25}
      PROVIDER_CANCEL_GRACE_SECONDS: ${PROVIDER_CANCEL_GRACE_SECONDS:-0.25}
      MCP_MAX_RESULT_BYTES: ${MCP_MAX_RESULT_BYTES:-65536}
      MCP_MAX_RESULT_ITEMS: ${MCP_MAX_RESULT_ITEMS:-256}
      MCP_MAX_RESULT_DEPTH: ${MCP_MAX_RESULT_DEPTH:-8}
      MCP_MAX_PARALLEL_TOOLS: ${MCP_MAX_PARALLEL_TOOLS:-4}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-mock}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      HTTP_PROXY: ${AGENT_HTTP_PROXY:-}
      HTTPS_PROXY: ${AGENT_HTTPS_PROXY:-}
      NO_PROXY: ${AGENT_NO_PROXY:-localhost,127.0.0.1,agent-service,auth-service,mcp-server,rabbitmq,web}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-512}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-/app/model-cache/sentence-transformers}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      # 模型缓存必须使用容器内路径，避免宿主机 Windows 路径污染 Linux 容器。
      HF_HOME: /app/model-cache/huggingface
      TRANSFORMERS_CACHE: /app/model-cache/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: /app/model-cache/sentence-transformers
      TORCH_HOME: /app/model-cache/torch
      XDG_CACHE_HOME: /app/model-cache/xdg
      RUNTIME_CONFIGURATION_FILE: /app/data/runtime-configuration.json
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      SESSION_CLEANUP_INTERVAL_SECONDS: ${SESSION_CLEANUP_INTERVAL_SECONDS:-30}
      SESSION_MAX_SESSIONS: ${SESSION_MAX_SESSIONS:-1024}
      SESSION_CLEANUP_BATCH_SIZE: ${SESSION_CLEANUP_BATCH_SIZE:-100}
      SESSION_CLEANUP_OUTBOX_PATH: ${SESSION_CLEANUP_OUTBOX_PATH:-/app/data/session-cleanup-outbox.jsonl}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      SESSION_HEARTBEAT_INTERVAL_SECONDS: ${SESSION_HEARTBEAT_INTERVAL_SECONDS:-15}
      REALTIME_HANDSHAKE_TIMEOUT_SECONDS: ${REALTIME_HANDSHAKE_TIMEOUT_SECONDS:-5}
      REALTIME_IDLE_TIMEOUT_SECONDS: ${REALTIME_IDLE_TIMEOUT_SECONDS:-45}
      REALTIME_INTERRUPT_TIMEOUT_SECONDS: ${REALTIME_INTERRUPT_TIMEOUT_SECONDS:-0.25}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-4000}
      AGENT_MAX_REQUEST_BODY_BYTES: ${AGENT_MAX_REQUEST_BODY_BYTES:-16777216}
      EVALUATION_BUFFER_SIZE: ${EVALUATION_BUFFER_SIZE:-2000}
      EVALUATION_RAW_ARCHIVE_PATH: ${EVALUATION_RAW_ARCHIVE_PATH:-/app/data/evaluation-runs.raw.jsonl}
      EVAL_INPUT_PRICE_PER_1K: ${EVAL_INPUT_PRICE_PER_1K:-0.003}
      EVAL_OUTPUT_PRICE_PER_1K: ${EVAL_OUTPUT_PRICE_PER_1K:-0.009}
      EVAL_CURRENCY: ${EVAL_CURRENCY:-CNY}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-true}
      DOCLING_ARTIFACTS_PATH: /app/model-cache/docling
      DOCLING_MAX_CONCURRENCY: ${DOCLING_MAX_CONCURRENCY:-1}
      DOCLING_OCR_BACKEND: ${DOCLING_OCR_BACKEND:-onnxruntime}
      DOCLING_OCR_LANG: ${DOCLING_OCR_LANG:-chinese}
      DOCLING_DO_OCR: ${DOCLING_DO_OCR:-true}
      DOCLING_DO_TABLE_STRUCTURE: ${DOCLING_DO_TABLE_STRUCTURE:-true}
      DOCLING_TABLE_MODE: ${DOCLING_TABLE_MODE:-accurate}
      RAG_MAX_CHUNKS: ${RAG_MAX_CHUNKS:-5000}
      RAG_MAX_DOCUMENT_BYTES: ${RAG_MAX_DOCUMENT_BYTES:-8388608}
      RAG_MAX_METADATA_BYTES: ${RAG_MAX_METADATA_BYTES:-65536}
      RAG_MAX_METADATA_ITEMS: ${RAG_MAX_METADATA_ITEMS:-128}
      RAG_MAX_METADATA_DEPTH: ${RAG_MAX_METADATA_DEPTH:-6}
      RAG_PARSE_CONCURRENCY: ${RAG_PARSE_CONCURRENCY:-1}
      RAG_STORE_PATH: /app/data/rag.sqlite3
      RAG_INDEX_PATH: /app/data/faiss
      RAG_STRICT_BINARY: ${RAG_STRICT_BINARY:-true}
      RAG_CHUNK_MAX_CHARS: ${RAG_CHUNK_MAX_CHARS:-720}
      RAG_CHUNK_OVERLAP_CHARS: ${RAG_CHUNK_OVERLAP_CHARS:-80}
      RAG_PARENT_MAX_CHARS: ${RAG_PARENT_MAX_CHARS:-2400}
      RAG_PARENT_OVERLAP_CHARS: ${RAG_PARENT_OVERLAP_CHARS:-160}
      RAG_INDEX_TYPE: ${RAG_INDEX_TYPE:-auto}
      RAG_HNSW_MIN_CHUNKS: ${RAG_HNSW_MIN_CHUNKS:-256}
      RAG_HNSW_M: ${RAG_HNSW_M:-32}
      RAG_HNSW_EF_SEARCH: ${RAG_HNSW_EF_SEARCH:-64}
      RAG_INDEX_CACHE_NAMESPACES: ${RAG_INDEX_CACHE_NAMESPACES:-64}
      RAG_SEARCH_CACHE_TTL_SECONDS: ${RAG_SEARCH_CACHE_TTL_SECONDS:-30}
      RAG_SEARCH_CACHE_MAX_ENTRIES: ${RAG_SEARCH_CACHE_MAX_ENTRIES:-2048}
      OBSERVABILITY_BUFFER_SIZE: ${OBSERVABILITY_BUFFER_SIZE:-1000}
      OBSERVABILITY_MAX_PENDING_TASKS: ${OBSERVABILITY_MAX_PENDING_TASKS:-256}
      OBSERVABILITY_PENDING_FLUSH_TIMEOUT_SECONDS: ${OBSERVABILITY_PENDING_FLUSH_TIMEOUT_SECONDS:-2}
      FUTUREAGI_ENABLED: ${FUTUREAGI_ENABLED:-false}
      FUTUREAGI_ENDPOINT: ${FUTUREAGI_ENDPOINT:-}
      FUTUREAGI_API_KEY: ${FUTUREAGI_API_KEY:-}
      FUTUREAGI_SECRET_KEY: ${FUTUREAGI_SECRET_KEY:-}
      FUTUREAGI_PROJECT: ${FUTUREAGI_PROJECT:-digital-human-agent}
      ALIYUN_AVATAR_ENABLED: ${ALIYUN_AVATAR_ENABLED:-false}
      ALIYUN_AVATAR_BASE_URL: ${ALIYUN_AVATAR_BASE_URL:-}
      ALIYUN_AVATAR_APP_ID: ${ALIYUN_AVATAR_APP_ID:-}
      ALIYUN_AVATAR_INSTANCE_ID: ${ALIYUN_AVATAR_INSTANCE_ID:-}
      ALIYUN_AVATAR_ACCESS_KEY_ID: ${ALIYUN_AVATAR_ACCESS_KEY_ID:-}
      ALIYUN_AVATAR_ACCESS_KEY_SECRET: ${ALIYUN_AVATAR_ACCESS_KEY_SECRET:-}
      MOFA_AVATAR_ENABLED: ${MOFA_AVATAR_ENABLED:-false}
      MOFA_GATEWAY_URL: ${MOFA_GATEWAY_URL:-}
      MOFA_APP_ID: ${MOFA_APP_ID:-}
      MOFA_APP_SECRET: ${MOFA_APP_SECRET:-}
      MOFA_SDK_URL: ${MOFA_SDK_URL:-https://media.xingyun3d.com/xingyun3d/general/litesdk/xmovAvatar@latest.js}
      MOFA_CRYPTO_URL: ${MOFA_CRYPTO_URL:-https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js}
      MOFA_EMOTION_ENABLED: ${MOFA_EMOTION_ENABLED:-false}
      MOFA_AUTHORIZATION: ${MOFA_AUTHORIZATION:-}
      IFLYTEK_AVATAR_ENABLED: ${IFLYTEK_AVATAR_ENABLED:-false}
      IFLYTEK_GATEWAY_URL: ${IFLYTEK_GATEWAY_URL:-}
      IFLYTEK_APP_ID: ${IFLYTEK_APP_ID:-}
      IFLYTEK_API_KEY: ${IFLYTEK_API_KEY:-}
      IFLYTEK_API_SECRET: ${IFLYTEK_API_SECRET:-}
      FAY_ENABLED: ${FAY_ENABLED:-false}
      FAY_BASE_URL: ${FAY_BASE_URL:-}
    expose:
      - "8000"
    volumes:
      - agent-runtime-config:/app/data
      - agent-model-cache:/app/model-cache
    depends_on:
      mcp-server:
        condition: service_healthy
      asr-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mcp-server:
    build:
      context: ./apps/mcp-server
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:-${AGENT_INTERNAL_TOKEN:-dev-internal-token}}
    expose:
      - "9000"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ican}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ican}
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  agent-runtime-config:
  agent-model-cache:
  asr-model-cache:
  rabbitmq-data:
  redis-data:
